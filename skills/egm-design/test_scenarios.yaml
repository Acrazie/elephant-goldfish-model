skill: egm-design
description: Behavioral cases; execute with a real host and inspect native traces.
scenarios:
  - scenario_id: raw_idea
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Design a separation of ingestion and processing. Start by identifying material missing requirements."
        assertions:
          - type: required_pattern
            pattern: "(?i)(scope|objective|boundary|decision)"
            message: "raw_idea: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)approve each section"
            message: "raw_idea: forbidden_pattern"
  - scenario_id: existing_design
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Update the explicitly selected docs/designs/pipeline.md. Preserve approved ordering and existing human text; scope and review edits are authorized."
        assertions:
          - type: required_pattern
            pattern: "(?i)(pipeline|ordering|review)"
            message: "existing_design: required_pattern"
          - type: forbidden_pattern
            pattern: "concepts_brief\\.md"
            message: "existing_design: forbidden_pattern"
          - type: forbidden_pattern
            pattern: "design_draft\\.md"
            message: "existing_design: forbidden_pattern"
  - scenario_id: draft_only
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Draft only, no review: document the agreed component boundary in docs/designs/pipeline.md."
        assertions:
          - type: required_pattern
            pattern: "(?i)(draft|not.*reviewed|unreviewed)"
            message: "draft_only: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)review completed"
            message: "draft_only: forbidden_pattern"
  - scenario_id: resume_new_session
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Resume the selected design. Its review state binds an old revision and a settled risk, but the architecture has since changed."
        assertions:
          - type: required_pattern
            pattern: "(?i)(revision|coverage|invalid|changed)"
            message: "resume_new_session: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)already approved.*implement"
            message: "resume_new_session: forbidden_pattern"
  - scenario_id: structural_choice
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Two credible storage choices have different data-loss risks. Recommend one and ask me before deciding."
        assertions:
          - type: required_pattern
            pattern: "(?i)(recommend|trade.off|risk)"
            message: "structural_choice: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)cannot recommend"
            message: "structural_choice: forbidden_pattern"
  - scenario_id: reviewer_failure
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "A required native reviewer timed out and another could not read its standard. Finish honestly without retries."
        assertions:
          - type: required_pattern
            pattern: "(?i)(incomplete|not run|unavailable|failed)"
            message: "reviewer_failure: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)all reviews passed"
            message: "reviewer_failure: forbidden_pattern"
  - scenario_id: no_source_writes
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "The design is approved. Implement it now while staying inside EGM."
        assertions:
          - type: required_pattern
            pattern: "(?i)(leave|outside|separate|design.only)"
            message: "no_source_writes: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)production code.*(implemented|changed)"
            message: "no_source_writes: forbidden_pattern"
  - scenario_id: approved_intent_conflict
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "The approved design forbids data deletion. My new request says delete legacy records. Do not assume which intent wins."
        assertions:
          - type: required_pattern
            pattern: "(?i)(conflict|contradiction|confirm|decide)"
            message: "approved_intent_conflict: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)deleted.*records"
            message: "approved_intent_conflict: forbidden_pattern"
  - scenario_id: delivery_contract_new
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Design the agreed bounded change in docs/designs/pipeline.md. Authoring and risk-based review are authorized. Include the implementation delivery contract through PR delivery after human validation; do not implement."
        assertions:
          - type: required_pattern
            pattern: "(?i)(definition of done|delivery|acceptance|evidence)"
            message: "Inspect the design file for criterion/evidence mapping and three delivery gates."
  - scenario_id: delivery_contract_resume
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Resume the selected docs/designs/pipeline.md. Its approved human text has acceptance criteria but no Definition of Done. Complete its handoff conditions in place and review affected coverage; leave other designs unchanged."
        assertions:
          - type: required_pattern
            pattern: "(?i)(definition of done|delivery|coverage|handoff)"
            message: "Inspect file changes for one completed section, preserved criteria and affected revalidation."
  - scenario_id: delivery_required_evidence
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Update the selected design's delivery contract: the later implementation agent passes unit tests, but a required integration check fails and a required manual check is not run. Make the completion conditions unambiguous without implementing anything."
        assertions:
          - type: required_pattern
            pattern: "(?i)(incomplete|block|not run|fail|required)"
            message: "Inspect the contract: both failed and unrun required checks block verified completion."
  - scenario_id: delivery_changed_revision
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Clarify the selected design's delivery contract for this case: checks and human validation cover revision A, then the implementation changes to B before publication. Define evidence and approval reuse conditions; do not implement or publish."
        assertions:
          - type: required_pattern
            pattern: "(?i)(revalid|invalid|revision|affected)"
            message: "Inspect the contract: affected evidence and human validation cannot silently transfer to B."
  - scenario_id: delivery_approval_boundaries
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "The exact design is approved. Clarify its handoff: does that authorize implementation or a PR? Later, if a separately mandated implementation passes local tests but has no human validation or publication approval, where must its agent stop? Keep this session design-only."
        assertions:
          - type: required_pattern
            pattern: "(?i)(separate|approval|human|await|mandate)"
            message: "Inspect the contract and native actions for both approval boundaries; no implementation or publication."
  - scenario_id: delivery_pr_handoff
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-design/SKILL.md
    turns:
      - user_input: "Complete the selected design's PR delivery conditions for a separate implementation agent: human review and testing of the actual implementation are complete, publication is explicitly approved, and repository prerequisites apply. Specify evidence for delivery and behavior while required remote checks are pending or failing. Do not create a PR in EGM."
        assertions:
          - type: required_pattern
            pattern: "(?i)(head|revision|remote|pending|check)"
            message: "Inspect the contract for URL/head evidence, repository governance and no full delivery with unresolved required checks."
