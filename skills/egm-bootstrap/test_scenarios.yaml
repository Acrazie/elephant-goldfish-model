skill: egm-bootstrap
description: Behavioral cases; execute with a real host and inspect native traces.
scenarios:
  - scenario_id: identified_gap
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-bootstrap/SKILL.md
    turns:
      - user_input: "Document only the non-obvious concurrency invariant in the existing component README. Keep human content."
        assertions:
          - type: required_pattern
            pattern: "(?i)(invariant|existing|preserv)"
            message: "identified_gap: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)README.*every directory"
            message: "identified_gap: forbidden_pattern"
  - scenario_id: already_documented
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-bootstrap/SKILL.md
    turns:
      - user_input: "The selected existing guide already covers the reader need. Avoid new documents."
        assertions:
          - type: required_pattern
            pattern: "(?i)(no changes|existing|already)"
            message: "already_documented: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)created.*index"
            message: "already_documented: forbidden_pattern"
  - scenario_id: scope_expansion
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-bootstrap/SKILL.md
    turns:
      - user_input: "Discovery exceeds 15 directories but I only authorized one component."
        assertions:
          - type: required_pattern
            pattern: "(?i)(scope|narrow|authorize|confirm)"
            message: "scope_expansion: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)spawn.*unbounded"
            message: "scope_expansion: forbidden_pattern"
