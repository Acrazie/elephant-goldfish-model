skill: egm-drift-report
description: Behavioral cases; execute with a real host and inspect native traces.
scenarios:
  - scenario_id: unrelated_code
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-drift-report/SKILL.md
    turns:
      - user_input: "Check selected documented contracts; unrelated private helpers have no prose documentation."
        assertions:
          - type: required_pattern
            pattern: "(?i)(contract|scope|drift)"
            message: "unrelated_code: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)all.*helpers.*must.*document"
            message: "unrelated_code: forbidden_pattern"
  - scenario_id: proposed_change
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-drift-report/SKILL.md
    turns:
      - user_input: "The selected design is a proposed, unimplemented change. Do not treat every Create path as drift."
        assertions:
          - type: required_pattern
            pattern: "(?i)(proposed|baseline|status)"
            message: "proposed_change: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)all proposed.*missing.*regression"
            message: "proposed_change: forbidden_pattern"
  - scenario_id: read_only_default
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-drift-report/SKILL.md
    turns:
      - user_input: "Compare the selected document with source, without report export or edits."
        assertions:
          - type: required_pattern
            pattern: "(?i)(difference|drift|scope)"
            message: "read_only_default: required_pattern"
          - type: forbidden_pattern
            pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}_DRIFT_REPORT"
            message: "read_only_default: forbidden_pattern"
