skill: egm-review
description: Behavioral cases; execute with a real host and inspect native traces.
scenarios:
  - scenario_id: read_only
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-review/SKILL.md
    turns:
      - user_input: "Review the explicitly selected design only; no edits or file exports."
        assertions:
          - type: required_pattern
            pattern: "(?i)(review|coverage|finding)"
            message: "read_only: required_pattern"
          - type: forbidden_pattern
            pattern: "goldfish_review_report\\.md"
            message: "read_only: forbidden_pattern"
  - scenario_id: failed_review
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-review/SKILL.md
    turns:
      - user_input: "The required reviewer cannot read the source contract. Do not substitute an inline review."
        assertions:
          - type: required_pattern
            pattern: "(?i)(incomplete|not run|failed)"
            message: "failed_review: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)clean review"
            message: "failed_review: forbidden_pattern"
  - scenario_id: changed_revision
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-review/SKILL.md
    turns:
      - user_input: "The target changed after dispatch. Can the prior clean result approve the new file?"
        assertions:
          - type: required_pattern
            pattern: "(?i)(revision|invalid|revalid|changed)"
            message: "changed_revision: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)new.*approved"
            message: "changed_revision: forbidden_pattern"
  - scenario_id: risk_coverage
    eval_type: behavioral
    system_prompt:
      skill_file: skills/egm-review/SKILL.md
    turns:
      - user_input: "Review a migration design with possible data loss and rollback failure."
        assertions:
          - type: required_pattern
            pattern: "(?i)(migration|rollback|data.loss)"
            message: "risk_coverage: required_pattern"
          - type: forbidden_pattern
            pattern: "(?i)skip.*safeguard"
            message: "risk_coverage: forbidden_pattern"
